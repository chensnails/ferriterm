[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/ft-core",
  "crates/ft-ssh",
  "crates/ft-pty",
  "crates/ft-store",
  "crates/ft-security",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
ft-core = { path = "crates/ft-core" }
ft-ssh = { path = "crates/ft-ssh" }
ft-pty = { path = "crates/ft-pty" }
ft-store = { path = "crates/ft-store" }
ft-security = { path = "crates/ft-security" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
portable-pty = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }

[profile.release]
strip = true
lto = true
codegen-units = 1