[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/ft-core",
  "crates/ft-ssh",
  "crates/ft-pty",
  "crates/ft-serial",
  "crates/ft-telnet",
  "crates/ft-store",
  "crates/ft-security",
  "crates/ft-import",
  "crates/ft-monitor",
  "crates/ft-sync",
  "crates/ft-plugin",
  "crates/ft-vfs",
  "crates/ft-transfer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
ft-core = { path = "crates/ft-core" }
ft-ssh = { path = "crates/ft-ssh" }
ft-pty = { path = "crates/ft-pty" }
ft-serial = { path = "crates/ft-serial" }
ft-telnet = { path = "crates/ft-telnet" }
ft-store = { path = "crates/ft-store" }
ft-security = { path = "crates/ft-security" }
ft-import = { path = "crates/ft-import" }
ft-monitor = { path = "crates/ft-monitor" }
ft-sync = { path = "crates/ft-sync" }
ft-plugin = { path = "crates/ft-plugin" }
ft-vfs = { path = "crates/ft-vfs" }
ft-transfer = { path = "crates/ft-transfer" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
portable-pty = "0.9"
serial2 = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
encoding_rs = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1