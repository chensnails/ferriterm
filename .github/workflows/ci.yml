name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version sync
        run: npm run version:check

      - name: UI lint
        run: npm run lint:ui

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@cargo-deny

      - run: cargo deny check

  e2e:
    name: End-to-end (WebDriver)
    # tauri-driver drives WebKitWebDriver, and the ubuntu-latest migration to
    # 26.04 dropped the webkit2gtk-driver package that provides it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install webview and WebDriver dependencies
        run: |
          bash scripts/ci-apt.sh \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev webkit2gtk-driver xvfb

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: ""

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the automation build out of the backend job's cache: embedded
          # frontend assets differ from the production build.
          key: webdriver-e2e

      - name: Install dependencies
        run: npm ci

      # VITE_E2E=1 exposes the terminal buffer as an accessibility tree, which
      # is the only text a WebDriver session can read back from xterm.
      - name: Build the app for automation
        run: |
          VITE_E2E=1 npm run build
          cargo build -p ferriterm

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Run the loopback WebDriver smoke test
        run: |
          set -euo pipefail
          bash testenv/setup.sh
          cargo build -p ferriterm --examples

          ./target/debug/examples/loopback_sshd &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT

          sleep 2
          xvfb-run -a env TAURI_WEBVIEW_AUTOMATION=true node e2e/smoke.mjs

      - name: Upload WebDriver artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdriver-e2e
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned for the same reason as the e2e job: Ubuntu 26.04 no longer
        # carries the WebKitGTK 4.1 development packages this build needs.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-apt.sh \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # The toolchain, rustfmt and clippy come from rust-toolchain.toml;
          # caching and warning promotion stay with the steps already here.
          cache: false
          build-warnings: ""

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Loopback SSH smoke tests
        shell: bash
        run: |
          set -euo pipefail
          bash testenv/setup.sh
          cargo build -p ferriterm --examples

          server=./target/debug/examples/loopback_sshd
          if [ -f "$server.exe" ]; then server="$server.exe"; fi
          "$server" &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          sleep 2
          cargo run -q -p ferriterm --example ssh_smoke
          cargo run -q -p ferriterm --example ft_ssh_smoke
