[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "https://rsproxy.cn/crates.io-index"

[net]
git-fetch-with-cli = true

# macOS system proxy may point at a dead local port; rsproxy is reachable direct.
# Override with CARGO_HTTP_PROXY when a proxy is actually required.
[http]
proxy = ""