[package]
name = "ferriterm"
version = "0.1.0"
description = "Cross-platform SSH terminal client scaffold (Rust + Tauri + xterm.js)"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ferriterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
portable-pty = "0.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
