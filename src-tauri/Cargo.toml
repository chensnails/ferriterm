[package]
name = "ferriterm"
description = "Cross-platform SSH terminal client (Rust + Tauri + xterm.js)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ferriterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
ft-core.workspace = true
ft-ssh.workspace = true
ft-pty.workspace = true
ft-serial.workspace = true
ft-telnet.workspace = true
ft-store.workspace = true
ft-security.workspace = true
ft-import.workspace = true
ft-monitor.workspace = true
ft-sync.workspace = true
ft-plugin.workspace = true
ft-vfs.workspace = true
ft-transfer.workspace = true
ft-ai.workspace = true
ft-policy.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
encoding_rs = "0.8"

[dev-dependencies]
russh.workspace = true
